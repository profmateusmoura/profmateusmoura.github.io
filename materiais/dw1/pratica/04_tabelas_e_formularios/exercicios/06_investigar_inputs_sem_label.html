<!--
  06_investigar_inputs_sem_label — Investigar e corrigir: formulário usando apenas placeholder sem <label>
  Tipo: Investigar e corrigir (debug)
  Tópico: 04 — Tabelas de dados e formulários de entrada

  Enunciado:
  O formulário abaixo usou apenas placeholder e esqueceu <label>, name e type adequados. Adicione <label for="..."> para cada campo, ajuste os atributos type/name e troque o <div onclick> por <button type="submit">.

  Critério de conferência no navegador / DevTools:
  Placeholders desaparecem ao digitar e não substituem <label>.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investigar e corrigir: formulário usando apenas placeholder sem <label> · DW1</title>
</head>
<body>
  <form>
    <input placeholder="Seu nome">
    <input placeholder="Quantidade (1 a 10)">
    <div>Enviar</div>
  </form>
</body>
</html>
