<!--
  DW1 · 03 — Marcos semânticos de página, links e imagens
  Exemplo: Artigo independente (article) para cartão de produto reutilizável
  Objetivo do tópico: Organizar regiões da página com header, nav, main, section, article, aside e footer, criar links de navegação e inserir imagens acessíveis.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartão Semântico · Lojas Blue</title>
</head>
<body>
  <main>
    <h1>Destaques da Vitrine</h1>
    <article>
      <header>
        <h2>Protetor Solar Facial FPS 60</h2>
        <p>Categoria: Dermocosméticos</p>
      </header>
      <p>Toque seco e rápida absorção. Embalagem de 50 g.</p>
      <footer>
        <p><strong>Preço:</strong> R$ 59,90 · <a href="#comprar">Reservar na loja</a></p>
      </footer>
    </article>
  </main>
</body>
</html>
