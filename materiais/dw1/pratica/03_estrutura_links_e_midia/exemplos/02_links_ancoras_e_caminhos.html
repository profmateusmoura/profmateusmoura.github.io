<!--
  DW1 · 03 — Marcos semânticos de página, links e imagens
  Exemplo: Links internos por âncora (#id), caminhos relativos e links externos seguros
  Objetivo do tópico: Organizar regiões da página com header, nav, main, section, article, aside e footer, criar links de navegação e inserir imagens acessíveis.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navegação e Links · Lojas Blue</title>
</head>
<body>
  <nav aria-label="Atalhos da página">
    <a href="#perfumaria">Ir para Perfumaria</a> |
    <a href="#higiene">Ir para Higiene</a> |
    <a href="01_regioes_semanticas.html">Ver exemplo anterior</a>
  </nav>
  <main>
    <section id="perfumaria">
      <h2>Setor de Perfumaria</h2>
      <p>Localizado no corredor 1 da unidade Centro.</p>
    </section>
    <section id="higiene">
      <h2>Setor de Higiene</h2>
      <p>Localizado no corredor 2 da unidade Centro.</p>
    </section>
  </main>
</body>
</html>
