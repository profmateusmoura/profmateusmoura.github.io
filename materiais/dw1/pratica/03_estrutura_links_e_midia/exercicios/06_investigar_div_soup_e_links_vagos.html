<!--
  06_investigar_div_soup_e_links_vagos — Investigar e corrigir: trocar excesso de <div> genéricas e links 'clique aqui'
  Tipo: Investigar e corrigir (debug)
  Tópico: 03 — Marcos semânticos de página, links e imagens

  Enunciado:
  Substitua as tags <div> genéricas por <header>, <main> e <footer>, adicione alt na imagem e troque o texto vago 'clique aqui' do link por um texto descritivo ('Ver política de trocas da Lojas Blue').

  Critério de conferência no navegador / DevTools:
  Links nunca devem se chamar apenas 'clique aqui' e toda imagem precisa de alt.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investigar e corrigir: trocar excesso de <div> genéricas e links 'clique aqui' · DW1</title>
</head>
<body>
  <div><h1>Lojas Blue</h1></div>
  <div>
    <p>Para conhecer nossas regras de devolução, <a href="#trocas">clique aqui</a>.</p>
  </div>
  <div><p>Rodapé Lojas Blue</p></div>
</body>
</html>
