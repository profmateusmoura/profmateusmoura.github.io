<!--
  DW1 · 07 — Layout moderno com Flexbox
  Exemplo: Centralização nos dois eixos e alinhamento de ícone + texto
  Objetivo do tópico: Alinhar e distribuir componentes em uma dimensão usando display: flex, flex-direction, justify-content, align-items, gap e flex-wrap.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centralização com Flex · Lojas Blue</title>
  <style>
    .banner {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #dff2e9;
      color: #133e34;
      border-radius: 12px;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <section class="banner">
    <h1>Semana do Cliente Lojas Blue</h1>
    <p>Descontos progressivos em todas as unidades.</p>
  </section>
</body>
</html>
