<!--
  DW1 · 07 — Layout moderno com Flexbox
  Exemplo: Cabeçalho de loja com marca à esquerda e menu à direita (justify-content: space-between)
  Objetivo do tópico: Alinhar e distribuir componentes em uma dimensão usando display: flex, flex-direction, justify-content, align-items, gap e flex-wrap.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabeçalho Flexbox · Lojas Blue</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: #133e34;
      color: #ffffff;
    }
    .nav-links { display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0; }
    .nav-links a { color: #d8ed84; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>LOJAS BLUE</strong>
    <ul class="nav-links">
      <li><a href="#1">Catálogo</a></li>
      <li><a href="#2">Ofertas</a></li>
      <li><a href="#3">Sacola (2)</a></li>
    </ul>
  </header>
</body>
</html>
