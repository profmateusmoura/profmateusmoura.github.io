<!--
  05_investigar_titulo_no_lugar_errado — Investigar e corrigir: <title> e <meta> colocados dentro do <body>
  Tipo: Investigar e corrigir (debug)
  Tópico: 01 — Como a Web funciona e o primeiro documento HTML

  Enunciado:
  O código abaixo colocou metadados dentro do <body> e um parágrafo dentro do <head>. Reorganize cada elemento para sua seção correta (<head> vs. <body>).

  Critério de conferência no navegador / DevTools:
  <meta> e <title> devem ficar exclusivamente dentro de <head>; <h1> e <p> devem ficar dentro de <body>.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investigar e corrigir: <title> e <meta> colocados dentro do <body> · DW1</title>
</head>
<body>
  <meta charset="utf-8">
  <title>Página com defeito estrutural</title>
  <h1>Conferência de Lote</h1>
  <p>Corrija a posição das tags deste documento.</p>
</body>
</html>
