<!--
  02_configurar_head_completo — Implementar: configurar metadados de página de ofertas
  Tipo: Implementar e estruturar
  Tópico: 01 — Como a Web funciona e o primeiro documento HTML

  Enunciado:
  Adicione dentro de <head> a codificação UTF-8, a meta tag viewport responsiva, uma meta description para a Semana Blue e o elemento <title>Ofertas da Semana · Lojas Blue</title>.

  Critério de conferência no navegador / DevTools:
  No DevTools (F12 > Elements), a tag <head> deve conter as três tags <meta> e a tag <title>.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Implementar: configurar metadados de página de ofertas · DW1</title>
</head>
<body>
  <h1>Semana Blue de Descontos</h1>
  <p>Confira os itens selecionados do setor de dermocosméticos.</p>
</body>
</html>
