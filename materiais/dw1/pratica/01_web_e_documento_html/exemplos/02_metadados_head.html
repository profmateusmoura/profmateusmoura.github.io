<!--
  DW1 · 01 — Como a Web funciona e o primeiro documento HTML
  Exemplo: Metadados essenciais no head (charset, viewport e description)
  Objetivo do tópico: Compreender o ciclo cliente-servidor (HTTP/URL), os papéis de HTML, CSS e JS e estruturar um documento HTML5 válido.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo oficial da Lojas Blue: perfumaria e cosméticos.">
  <title>Catálogo · Lojas Blue</title>
</head>
<body>
  <h1>Catálogo de Perfumaria</h1>
  <p>Abra a aba Elements/Inspecionar (F12) para observar a separação entre head e body.</p>
</body>
</html>
