<!--
  01_estilizar_catalogo_por_classes — Implementar: estilizar cartões e selos usando classes CSS
  Tipo: Implementar e estruturar
  Tópico: 05 — Introdução ao CSS: seletores, cascata e tipografia

  Enunciado:
  Escreva regras CSS em <style> para que .cartao tenha fundo branco e borda #dee6e0, e .esgotado tenha texto cinza (#718278) e fundo #f1f5f2.

  Critério de conferência no navegador / DevTools:
  Prefira classes reutilizáveis (.cartao, .esgotado) em vez de estilizar IDs individuais.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Exercício Seletores</title>
  <style>
    /* Escreva suas regras CSS aqui */
  </style>
</head>
<body>
  <div class="cartao"><h2>Shampoo Blue</h2><p>Disponível</p></div>
  <div class="cartao esgotado"><h2>Colônia Lavanda</h2><p>Indisponível</p></div>
</body>
</html>
