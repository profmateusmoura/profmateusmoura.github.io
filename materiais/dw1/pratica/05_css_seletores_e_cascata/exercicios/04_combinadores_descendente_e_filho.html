<!--
  04_combinadores_descendente_e_filho — Implementar: estilizar apenas links dentro do menu (.menu a)
  Tipo: Implementar e estruturar
  Tópico: 05 — Introdução ao CSS: seletores, cascata e tipografia

  Enunciado:
  Use um seletor descendente (.menu a) para deixar os links do menu sem sublinhado (text-decoration: none) e em negrito, mantendo os links comuns do texto sublinhados.

  Critério de conferência no navegador / DevTools:
  Links fora de .menu devem continuar sublinhados para acessibilidade.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Combinadores</title>
  <style>
    /* Estilize .menu a sem afetar os demais links */
  </style>
</head>
<body>
  <nav class="menu"><a href="#1">Perfumaria</a> | <a href="#2">Higiene</a></nav>
  <p>Consulte também o <a href="#regulamento">regulamento completo da promoção</a>.</p>
</body>
</html>
