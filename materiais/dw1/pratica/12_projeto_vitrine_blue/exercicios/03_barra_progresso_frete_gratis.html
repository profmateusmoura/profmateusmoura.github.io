<html lang="pt-BR">

  <title>Implementar: atualizar barra de progresso rumo a R$ 100 de frete grátis · DW1</title>
</head>
<body>
  <progress id="barra-frete" value="40" max="100"></progress>
  <p id="aviso-frete">Faltam R$ 60,00</p>
  <button type="button" id="somar30">+ R$ 30,00 na sacola</button>
  <script>
    let subtotal = 40;
    // Ao clicar em #somar30, atualize subtotal, barra.value e #aviso-frete
  </script>
</body>
</html>
