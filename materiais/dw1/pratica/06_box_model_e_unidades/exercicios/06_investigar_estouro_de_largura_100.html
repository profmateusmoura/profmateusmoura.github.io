<!--
  06_investigar_estouro_de_largura_100 — Investigar e corrigir: caixa com width: 100% + padding estourando a tela
  Tipo: Investigar e corrigir (debug)
  Tópico: 06 — Modelo de Caixa (Box Model), dimensões e posicionamento

  Enunciado:
  A barra abaixo tem width: 100% e padding: 24px no modo content-box padrão, gerando rolagem horizontal indesejada. Corrija adicionando box-sizing: border-box.

  Critério de conferência no navegador / DevTools:
  A página não deve ter rolagem horizontal.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Corrigir Estouro</title>
  <style>
    body { margin: 0; }
    .topo { width: 100%; padding: 24px; border: 4px solid #1c6550; background: #dff2e9; }
  </style>
</head>
<body>
  <header class="topo">Cabeçalho Lojas Blue sem estouro lateral</header>
</body>
</html>
