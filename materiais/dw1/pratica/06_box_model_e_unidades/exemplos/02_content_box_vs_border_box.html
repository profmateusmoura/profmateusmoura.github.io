<!--
  DW1 · 06 — Modelo de Caixa (Box Model), dimensões e posicionamento
  Exemplo: Comparação direta: content-box (padrão que soma borda/padding) vs. border-box
  Objetivo do tópico: Dominar content, padding, border, margin, box-sizing: border-box, unidades relativas (rem, %, vw/vh), modos de display e estados :hover/:focus-visible.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>content-box vs border-box · Lojas Blue</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1.5rem; }
    .caixa { width: 260px; padding: 20px; border: 5px solid #1c6550; margin-bottom: 1rem; background: #dff2e9; }
    .padrao { box-sizing: content-box; } /* Largura final: 260 + 40 + 10 = 310px */
    .moderno { box-sizing: border-box; } /* Largura final: exatamente 260px */
  </style>
</head>
<body>
  <div class="caixa padrao">content-box: 260px + padding (40px) + border (10px) = 310px reais</div>
  <div class="caixa moderno">border-box: 260px totais (padding e border cabem dentro dos 260px)</div>
</body>
</html>
