<!--
  05_teste_de_mesa_outline — Teste de mesa Web: auditar a árvore de títulos de uma página
  Tipo: Teste de mesa Web (inspecionar e prever)
  Tópico: 02 — Estrutura de texto e semântica de conteúdo

  Enunciado:
  Analise a estrutura abaixo e indique no parágrafo #diagnostico quantos títulos de nível 2 (<h2>) e quantos de nível 3 (<h3>) compõem o documento.

  Critério de conferência no navegador / DevTools:
  A contagem correta é 2 elementos h2 e 3 elementos h3.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de mesa Web: auditar a árvore de títulos de uma página · DW1</title>
</head>
<body>
  <h1>Manual Lojas Blue</h1>
  <h2>Abertura</h2>
  <h3>Caixa</h3>
  <h3>Vitrine</h3>
  <h2>Fechamento</h2>
  <h3>Relatório</h3>
  <p id="diagnostico">Total de h2 = ? | Total de h3 = ?</p>
</body>
</html>
