<!--
  06_investigar_falsa_lista_com_br — Investigar e corrigir: substituir quebras <br> improvisadas por lista semântica
  Tipo: Investigar e corrigir (debug)
  Tópico: 02 — Estrutura de texto e semântica de conteúdo

  Enunciado:
  O código abaixo usou um único <p> cheio de <br> e hifens manuais para fingir uma lista, além de usar <h4> apenas para deixar a letra menor. Substitua por <h2> e uma lista <ul> com <li>.

  Critério de conferência no navegador / DevTools:
  Não deve restar nenhum <br> para separar itens de lista nem salto de <h1> para <h4>.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investigar e corrigir: substituir quebras <br> improvisadas por lista semântica · DW1</title>
</head>
<body>
  <h1>Setores da Loja</h1>
  <h4>Itens de reposição urgente</h4>
  <p>- Shampoo<br>- Condicionador<br>- Sabonete</p>
</body>
</html>
