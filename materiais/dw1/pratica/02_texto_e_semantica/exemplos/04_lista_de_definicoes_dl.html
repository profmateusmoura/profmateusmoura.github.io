<!--
  DW1 · 02 — Estrutura de texto e semântica de conteúdo
  Exemplo: Ficha técnica de produto com lista de descrição (dl, dt, dd)
  Objetivo do tópico: Estruturar textos com hierarquia de títulos (h1–h6), parágrafos, ênfase semântica (strong, em) e listas (ul, ol, dl).
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha Técnica com dl · Lojas Blue</title>
</head>
<body>
  <h1>Ficha Técnica — Sérum Facial Vitamina C</h1>
  <dl>
    <dt>Código SKU</dt>
    <dd>BLU-8841</dd>
    <dt>Volume</dt>
    <dd>30 ml</dd>
    <dt>Indicação</dt>
    <dd>Uso diário pela manhã antes do protetor solar.</dd>
  </dl>
</body>
</html>
