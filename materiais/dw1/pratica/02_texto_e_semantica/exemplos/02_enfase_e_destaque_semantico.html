  Objetivo do tópico: Estruturar textos com hierarquia de títulos (h1–h6), parágrafos, ênfase semântica (strong, em) e listas (ul, ol, dl).

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semântica de Texto · Lojas Blue</title>
</head>
<body>
  <h1>Normas de Recebimento de Mercadorias</h1>
  <p><strong>Atenção:</strong> confira a validade do lote <em>antes</em> de assinar o canhoto da nota fiscal.</p>
  <p>No sistema interno, utilize o código de operação <code>REC-204</code> para registrar a entrada.</p>
  <blockquote>
    <p>Qualidade no estoque começa na conferência de entrada.</p>
  </blockquote>
</body>
</html>
