<!--
  DW1 · 09 — Primeiros passos com JavaScript no navegador e o DOM
  Exemplo: Leitura e atualização de atributos HTML (setAttribute, hidden, disabled e dataset)
  Objetivo do tópico: Compreender a árvore DOM, selecionar elementos com querySelector/querySelectorAll e atualizar textos (textContent), classes (classList) e atributos com segurança.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atributos e Dataset · Lojas Blue</title>
</head>
<body>
  <article id="item" data-estoque="0">
    <h2>Colônia Lavanda</h2>
    <p id="status-item">Verificando...</p>
    <button type="button" id="btn-comprar">Comprar</button>
  </article>
  <script>
    const item = document.querySelector('#item');
    const estoque = Number(item.dataset.estoque);
    const botao = document.querySelector('#btn-comprar');
    const status = document.querySelector('#status-item');
    if (estoque === 0) {
      status.textContent = 'Produto esgotado no momento';
      botao.disabled = true;
    }
  </script>
</body>
</html>
