<!--
  DW1 · 09 — Primeiros passos com JavaScript no navegador e o DOM
  Exemplo: Alternar estado visual de componentes usando classList (add, remove, toggle)
  Objetivo do tópico: Compreender a árvore DOM, selecionar elementos com querySelector/querySelectorAll e atualizar textos (textContent), classes (classList) e atributos com segurança.
  Como usar: abra este arquivo no navegador e no VS Code; inspecione com F12.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>classList no DOM · Lojas Blue</title>
  <style>
    .card { padding: 1rem; border: 1px solid #dee6e0; border-radius: 8px; }
    .destaque-oferta { background: #dff2e9; border-color: #1c6550; font-weight: 700; }
  </style>
</head>
<body>
  <article id="produto-1" class="card">Shampoo Neutro — R$ 19,90</article>
  <script>
    const card = document.querySelector('#produto-1');
    card.classList.add('destaque-oferta');
  </script>
</body>
</html>
